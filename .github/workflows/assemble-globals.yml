name: Assemble globals.css
on:
  push:
    paths:
      - 'globals-parts/**'
      - '.github/workflows/assemble-globals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write globals.css
        run: |
          python3 << 'PY'
          import pathlib
          parts = sorted(pathlib.Path('globals-parts').glob('part-*.txt'))
          data = ''.join(p.read_text() for p in parts)
          pathlib.Path('app').mkdir(exist_ok=True)
          pathlib.Path('app/globals.css').write_text(data)
          print('wrote', len(data))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf globals-parts
          rm -f .github/workflows/assemble-globals.yml
          git add -A
          git commit -m "Add app/globals.css via Actions" || exit 0
          git push
